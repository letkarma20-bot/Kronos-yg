<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c35">
<title>KRONOS | Gestão Escolar</title>
<style>
:root{--navy:#10251c;--navy2:#174d35;--ink:#111713;--muted:#66756b;--bg:#f2f6f3;--card:#fff;--line:#dce7df;--blue:#24734b;--soft:#e6f1e9}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Roboto,sans-serif;background:var(--bg);color:var(--ink)}body.dark{--bg:#0b110d;--card:#111b14;--ink:#edf5ef;--muted:#a8b9ac;--line:#293b2e;--soft:#1b3022}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:600}button.secondary{background:var(--soft);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#070b08,#163b28)}.loginbox{width:min(420px,100%);background:white;color:#111827;border-radius:20px;padding:30px;box-shadow:0 20px 70px #0005;text-align:center}.logo{width:100px;height:100px;object-fit:contain;margin:auto;display:block}.brand{font-size:28px;letter-spacing:4px;font-weight:800;margin:8px 0}.loginbox p{color:#64748b}.loginbox input{background:white;color:#111827}
#app{min-height:100vh}.top{background:var(--navy);color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.topbrand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:2px}.topbrand img{width:40px;height:40px;object-fit:contain;background:white;border-radius:8px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}aside{background:var(--card);border-right:1px solid var(--line);padding:16px}.navbtn{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:var(--ink);font-weight:500}.navbtn.active,.navbtn:hover{background:var(--soft);color:var(--blue)}main{padding:24px;max-width:1200px;width:100%;margin:auto}.welcome{display:flex;align-items:center;gap:14px;margin-bottom:22px}.welcome img{width:68px;height:68px;object-fit:contain}.welcome h1{margin:0 0 5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:14px}.metric{font-size:27px;font-weight:800;margin-top:8px}.card h3{margin:0 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:160px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border:0}.pill{display:inline-block;background:var(--soft);color:var(--blue);border-radius:20px;padding:4px 9px;font-size:12px}.notice{background:#fff7df;color:#765400;border:1px solid #f2dfa0;padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px}body.dark .notice{background:#382d13;color:#ffe4a1;border-color:#66501d}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}.empty{color:var(--muted);padding:18px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.manual h3{margin-bottom:5px}.small{font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{display:block}aside{display:flex;overflow:auto;gap:5px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.navbtn{white-space:nowrap;width:auto;margin:0;padding:9px 12px}main{padding:16px}.top{padding:10px 14px}.top .small{display:none}}
@media print{.top,aside,.no-print,button{display:none!important}.layout{display:block}main{padding:0}.card{break-inside:avoid;border:0}}
</style>
</head>
<body>
<section id="login">
 <div class="loginbox">
  <img class="logo" src="logo-kronos.jpg" alt="Logo KRONOS">
  <div class="brand">KRONOS</div><p>Sistema de organização escolar</p>
  <label for="role">Entrar como</label><select id="role"><option value="student">Aluno</option><option value="teacher">Professor</option></select>
  <div id="studentFields"><label>Nome do aluno</label><input id="studentName" placeholder="Digite seu nome"></div>
  <div id="teacherFields" class="hidden"><label>Senha do professor</label><input id="teacherPass" type="password" placeholder="Senha de demonstração"></div>
  <button style="width:100%;margin-top:18px" onclick="login()">Entrar</button>
  <p class="small">Protótipo demonstrativo. Não use dados reais de alunos.</p>
 </div>
</section>
<div id="app" class="hidden">
 <header class="top"><div class="topbrand"><img src="logo-kronos.jpg" alt=""> KRONOS</div><div class="row"><span id="who" class="small" style="color:#d7e4fa"></span><button class="ghost" onclick="toggleTheme()">Tema</button><button class="ghost" onclick="logout()">Sair</button></div></header>
 <div class="layout">
  <aside id="menu"></aside>
  <main id="content"></main>
 </div>
</div>
<script>
const KEY='kronos-demo-v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"subjects":["Química","Projeto de Vida"],"materials":[],"events":[],"students":[],"lessons":[],"grades":[]}');
let role='student', student='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('role').addEventListener('change',e=>{document.getElementById('teacherFields').classList.toggle('hidden',e.target.value!=='teacher');document.getElementById('studentFields').classList.toggle('hidden',e.target.value==='teacher')});
function login(){role=document.getElementById('role').value;student=document.getElementById('studentName').value.trim();if(role==='teacher'&&document.getElementById('teacherPass').value!==teacherPassword){alert('Senha incorreta. Senha inicial demonstrativa: uniclass2025');return}if(role==='student'&&!student){alert('Digite seu nome.');return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=role==='teacher'?'Professor (edição)':student+' (visualização)';buildMenu();show('home')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function toggleTheme(){document.body.classList.toggle('dark')}
const pages=[['home','⌂','Início'],['subjects','▤','Matérias'],['materials','▧','Materiais'],['agenda','▦','Agenda'],['diary','▤','Diário de classe'],['students','♙','Alunos'],['grades','▥','Notas'],['manual','ⓘ','Manual'],['settings','⚙','Configurações']];
function buildMenu(){document.getElementById('menu').innerHTML=pages.map(p=>`<button class="navbtn" data-page="${p[0]}" onclick="show('${p[0]}')">${p[1]} &nbsp; ${p[2]}</button>`).join('')}
function head(title,desc=''){return `<div class="sectionhead"><div><h1>${title}</h1><div class="muted">${desc}</div></div>${role==='teacher'?'<span class="pill">Modo de edição</span>':'<span class="pill">Somente visualização</span>'}</div>`}
function formField(label,id,placeholder='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`}
function show(page){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c=document.getElementById('content');let edit=role==='teacher';let out='';
if(page==='home'){out=`<div class="welcome"><img src="logo-kronos.jpg"><div><h1>Bem-vindo ao KRONOS</h1><div class="muted">Organização escolar em um só lugar.</div></div></div><div class="grid">${[['Matérias',db.subjects.length],['Materiais',db.materials.length],['Eventos',db.events.length],['Alunos',db.students.length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="card"><h3>Acesso rápido</h3><p class="muted">Consulte matérias, materiais, agenda, diário e notas pelo menu.</p></div>`}
if(page==='subjects'){out=head('Matérias','Disciplinas cadastradas no sistema.')+(edit?`<div class="card"><div class="row">${formField('Nova matéria','newSubject','Ex.: Biologia')}<button onclick="addSubject()">Adicionar</button></div></div>`:'')+`<div class="card">${db.subjects.map(s=>`<div class="item">📘 ${esc(s)}</div>`).join('')||'<div class="empty">Nenhuma matéria cadastrada.</div>'}</div>`}
if(page==='materials'){out=head('Materiais','Textos, links e arquivos de aula.')+(edit?`<div class="card"><div class="row">${formField('Título','matTitle','Nome do material')}<div class="field"><label>Matéria</label><select id="matSubject">${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><label>Texto ou link</label><textarea id="matText" rows="2" placeholder="Cole um link ou escreva uma descrição"></textarea><label>Arquivo (neste protótipo, o anexo fica apenas nesta sessão)</label><input id="matFile" type="file"><div class="actions"><button onclick="addMaterial()">Salvar material</button></div></div>`:'')+`<div class="card">${db.materials.map(m=>`<div class="item"><b>${esc(m.title)}</b> <span class="pill">${esc(m.subject)}</span><p>${esc(m.text)}</p>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">Abrir link</a>`:''}</div>`).join('')||'<div class="empty">Nenhum material publicado.</div>'}</div>`}
if(page==='agenda'){out=head('Agenda','Provas, entregas, aulas e compromissos.')+(edit?`<div class="card"><div class="row">${formField('Título','evTitle','Ex.: Prova de química')}${formField('Data','evDate','','date')}${formField('Horário','evTime','','time')}</div><div class="row"><div class="field"><label>Matéria</label><select id="evSubject">${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>${formField('Tipo','evType','Prova / entrega / aula')}</div><div class="actions"><button onclick="addEvent()">Adicionar à agenda</button></div></div>`:'')+`<div class="card">${db.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="item"><b>${esc(e.title)}</b> <span class="pill">${esc(e.subject)}</span><div class="muted">${esc(e.date)} às ${esc(e.time)} · ${esc(e.type)}</div></div>`).join('')||'<div class="empty">Agenda vazia.</div>'}</div>`}
if(page==='diary'){out=head('Diário de classe','Registros em sequência de datas, com cabeçalho escolar.')+(edit?`<div class="card"><div class="row">${formField('Escola','school','Nome da escola')}${formField('Professor','teacherName','Nome do professor')}</div><div class="row"><div class="field"><label>Matéria</label><select id="lessonSubject">${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>${formField('Turma','className','Ex.: 2º ano')}${formField('Data','lessonDate','','date')}</div><label>Conteúdo</label><textarea id="lessonContent" rows="2"></textarea><label>Chamada</label><textarea id="lessonCall" rows="2" placeholder="Presentes e ausentes"></textarea><label>Ocorrências</label><textarea id="lessonOcc" rows="2"></textarea><div class="actions"><button onclick="addLesson()">Salvar registro</button><button class="secondary" onclick="window.print()">Imprimir diário</button></div></div>`:`<div class="card no-print"><button onclick="window.print()">Imprimir diário</button></div>`)+`<div class="card"><h2>Registros do diário</h2>${db.lessons.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(l=>`<div class="item"><b>${esc(l.school)} · ${esc(l.subject)} · ${esc(l.className)}</b><div class="muted">${esc(l.date)} | Professor: ${esc(l.teacherName)}</div><p><b>Conteúdo:</b> ${esc(l.content)}</p><p><b>Chamada:</b> ${esc(l.call)}</p><p><b>Ocorrências:</b> ${esc(l.occ)}</p></div>`).join('')||'<div class="empty">Nenhuma aula registrada.</div>'}</div>`}
if(page==='students'){out=head('Alunos','Cadastro por nome e turma/ano.')+(edit?`<div class="card"><div class="row">${formField('Nome','stName','Nome completo')}${formField('Turma/ano','stClass','Ex.: 2º ano') }<button onclick="addStudent()">Cadastrar</button></div></div>`:'')+`<div class="card tablewrap"><table><tr><th>Aluno</th><th>Turma/ano</th></tr>${db.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.clazz)}</td></tr>`).join('')}</table>${db.students.length?'':'<div class="empty">Nenhum aluno cadastrado.</div>'}</div>`}
if(page==='grades'){let visible=db.grades.filter(g=>role==='teacher'||g.student.toLowerCase()===student.toLowerCase());out=head('Notas e médias','Escala de 0 a 10. A média é calculada automaticamente.')+(edit?`<div class="card"><div class="row">${formField('Nome do aluno','grStudent','Nome cadastrado')}${formField('Matéria','grSubject','Ex.: Química')}${formField('Avaliação','grTitle','Prova 1')}${formField('Nota (0 a 10)','grValue','','number')}</div><div class="actions"><button onclick="addGrade()">Salvar nota</button></div></div>`:'')+`<div class="card"><h3>${edit?'Notas cadastradas':'Suas notas'}</h3>${visible.map(g=>`<div class="item"><b>${esc(g.student)}</b> · ${esc(g.subject)}<div>${esc(g.title)}: <b>${Number(g.value).toFixed(1)}</b></div></div>`).join('')||'<div class="empty">Nenhuma nota disponível para esta consulta.</div>'}${edit?`<div class="item"><b>Médias por aluno e matéria</b>${[...new Set(db.grades.map(g=>g.student+'|'+g.subject))].map(k=>{let [n,s]=k.split('|'),a=db.grades.filter(g=>g.student===n&&g.subject===s),m=a.reduce((x,g)=>x+Number(g.value),0)/a.length;return `<p>${esc(n)} · ${esc(s)}: <b>${m.toFixed(2)}</b></p>`}).join('')}</div>`:''}</div>`}
if(page==='manual'){out=head('Manual do usuário','Como utilizar o KRONOS.')+`<div class="card manual"><h3>1. Acesso</h3><p>Alunos entram em modo de consulta. O professor entra com a senha administrativa.</p><h3>2. Matérias e materiais</h3><p>O professor pode adicionar disciplinas, textos e links de apoio.</p><h3>3. Agenda</h3><p>Cadastre eventos com data, horário, matéria e tipo.</p><h3>4. Diário de classe</h3><p>Registre escola, professor, turma, matéria, data, conteúdo, chamada e ocorrências. Use Imprimir para gerar uma versão impressa.</p><h3>5. Notas</h3><p>O professor cadastra notas de 0 a 10. A média é calculada por aluno e matéria.</p><h3>6. Segurança</h3><p>Este protótipo não possui autenticação real nem banco de dados online. Não armazene informações escolares reais.</p><div class="actions no-print"><button onclick="window.print()">Imprimir manual</button></div></div>`}
if(page==='settings'){out=head('Configurações','Preferências do aplicativo.')+`<div class="card"><h3>Aparência</h3><p class="muted">Alterne entre tema claro e escuro pelo botão no topo. A configuração de sistema será adicionada na versão conectada.</p>${edit?`<h3>Senha do professor</h3><label>Nova senha (somente nesta demonstração)</label><input id="newPass" type="password" placeholder="Nova senha"><div class="actions"><button onclick="changePass()">Alterar senha</button></div>`:''}</div><div class="notice">A senha inicial demonstrativa é uniclass2025. Este protótipo não oferece proteção adequada para uso real.</div>`}
c.innerHTML=out}
let teacherPassword='uniclass2025';
function needTeacher(){if(role!=='teacher'){alert('Somente o professor pode alterar informações.');return false}return true}
function addSubject(){if(!needTeacher())return;let v=document.getElementById('newSubject').value.trim();if(v&&!db.subjects.includes(v)){db.subjects.push(v);save();show('subjects')}}
function addMaterial(){if(!needTeacher())return;let title=document.getElementById('matTitle').value.trim(),text=document.getElementById('matText').value.trim();if(!title)return alert('Informe o título.');db.materials.push({title,text,subject:document.getElementById('matSubject').value,url:/^https?:\/\//i.test(text)?text:''});save();show('materials')}
function addEvent(){if(!needTeacher())return;let title=document.getElementById('evTitle').value.trim();if(!title)return alert('Informe o título.');db.events.push({title,date:document.getElementById('evDate').value,time:document.getElementById('evTime').value,subject:document.getElementById('evSubject').value,type:document.getElementById('evType').value});save();show('agenda')}
function addLesson(){if(!needTeacher())return;db.lessons.push({school:document.getElementById('school').value,teacherName:document.getElementById('teacherName').value,subject:document.getElementById('lessonSubject').value,className:document.getElementById('className').value,date:document.getElementById('lessonDate').value,content:document.getElementById('lessonContent').value,call:document.getElementById('lessonCall').value,occ:document.getElementById('lessonOcc').value});save();show('diary')}
function addStudent(){if(!needTeacher())return;let name=document.getElementById('stName').value.trim(),clazz=document.getElementById('stClass').value.trim();if(!name||!clazz)return alert('Preencha nome e turma.');db.students.push({name,clazz});save();show('students')}
function addGrade(){if(!needTeacher())return;let value=Number(document.getElementById('grValue').value);if(!document.getElementById('grStudent').value.trim()||!Number.isFinite(value)||value<0||value>10)return alert('Informe aluno e nota entre 0 e 10.');db.grades.push({student:document.getElementById('grStudent').value.trim(),subject:document.getElementById('grSubject').value.trim(),title:document.getElementById('grTitle').value.trim(),value});save();show('grades')}
function changePass(){if(!needTeacher())return;let p=document.getElementById('newPass').value;if(p.length<8)return alert('Use pelo menos 8 caracteres.');teacherPassword=p;alert('Senha alterada nesta sessão de demonstração.')}
</script>
</body></html>
